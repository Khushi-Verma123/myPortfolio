<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              google: {
                blue: '#4285F4',
                red: '#EA4335',
                yellow: '#FBBC05',
                green: '#34A853',
                dark: '#1F1F1F',

        box-shadow: 0 12px 30px -4px rgba(66, 133, 244, 0.2);

</html>
