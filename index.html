                            />

                      </div>
                    </div>

                            </div>

                              <input 
                                type="text" 
                                value={ac.icon}

                                  const updated = [...editData.aboutCards];

                                placeholder="Badge (e.g. DSA)"
                                className="w-1/3 px-3 py-1.5 rounded-lg bg-white dark:bg-slate-900 text-xs font-mono"

                                type="text" 
                                value={ac.title}
                                onChange={(e) => {
                                  const updated = [...editData.aboutCards];

                                  max="100"
                                  value={sk.level}
                                  onChange={(e) => {
                                    const updated = [...editData.skills];
                                    updated[sIdx].level = parseInt(e.target.value) || 0;
                                    setEditData({...editData, skills: updated});
                                  }}
                                  className="w-full px-3 py-1 rounded-lg bg-white dark:bg-slate-900 text-xs font-mono"
                                />
                              </div>
                              <div className="w-1/2">
                                <label className="block text-[10px] font-semibold text-slate-400">Category</label>
                                <input 
                                  type="text" 
                                  value={sk.category || 'Web'}
                                  onChange={(e) => {
                                    const updated = [...editData.skills];
                                    updated[sIdx].category = e.target.value;
                                    setEditData({...editData, skills: updated});
                                  }}
                                  placeholder="Category"
                                  className="w-full px-3 py-1 rounded-lg bg-white dark:bg-slate-900 text-xs"
                                />

                    {/* 6. Projects & Demo Videos */}

                      </div>
                      <div className="space-y-4">
                        {editData.projects.map((proj, pIdx) => (
                          <div key={proj.id || pIdx} className="p-4 rounded-2xl bg-slate-100 dark:bg-slate-800/80 space-y-3 border border-slate-200 dark:border-slate-700">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-xs text-google-blue">Project #{pIdx + 1}: {proj.title}</span>
                              <button type="button" onClick={() => handleDeleteProject(pIdx)} className="text-google-red text-xs font-bold">Remove Project</button>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                              <div>
                                <label className="block text-[11px] font-bold mb-1">Project Title</label>

                                  type="text" 
                                  value={proj.title}
                                  onChange={(e) => {
                                    const updated = [...editData.projects];
                                    updated[pIdx].title = e.target.value;
                                    setEditData({...editData, projects: updated});

                                  placeholder="Project Title"
                                  className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-xs"

                              <div>

                                  type="text" 
                                  value={proj.tech}
                                  onChange={(e) => {
                                    const updated = [...editData.projects];
                                    updated[pIdx].tech = e.target.value;
                                    setEditData({...editData, projects: updated});

                                  placeholder="Tech Stack"
                                  className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-xs"
                                />
                              </div>
                            </div>
                            
                            <div>
                              <label className="block text-[11px] font-bold mb-1">Project Description</label>

                                rows={2}
                                value={proj.desc}
                                onChange={(e) => {
                                  const updated = [...editData.projects];
                                  updated[pIdx].desc = e.target.value;
                                  setEditData({...editData, projects: updated});
                                }}
                                placeholder="Project Description"
                                className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-xs resize-none"
                              />
                            </div>

                            {/* Demo Video URL & Thumbnail URL Inputs */}
                            <div className="p-3 bg-white dark:bg-slate-900 rounded-xl space-y-3 border border-slate-200 dark:border-slate-800">

                                <label className="block text-[11px] font-bold text-google-red mb-1">📹 Demo Video Link (YouTube or MP4)</label>

                                  type="text" 
                                  value={proj.videoUrl || ''}
                                  onChange={(e) => {
                                    const updated = [...editData.projects];
                                    updated[pIdx].videoUrl = e.target.value;
                                    setEditData({...editData, projects: updated});

                                      updated[pIdx].thumbUrl = e.target.value;

                                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-xs font-mono"

                                <div>
                                  <label className="block text-[11px] font-bold mb-1">🐙 GitHub Repository URL</label>
                                  <input 
                                    type="text" 
                                    value={proj.github || ''}
                                    onChange={(e) => {
                                      const updated = [...editData.projects];
                                      updated[pIdx].github = e.target.value;
                                      setEditData({...editData, projects: updated});
                                    }}
                                    placeholder="GitHub URL"
                                    className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-xs font-mono"

                      <div className="space-y-3">
                        {(editData.experience || []).map((exp, eIdx) => (

                              <span className="font-bold text-xs text-google-blue">Experience #{eIdx + 1}</span>

                                type="text"

                              rows={2}

                                updated[eIdx].details = e.target.value;

                                type="text"

                                  const updated = [...editData.education];

                      </div>
                      <div className="space-y-3">
                        {(editData.certifications || []).map((cert, cIdx) => (
                          <div key={cIdx} className="p-4 rounded-xl bg-slate-100 dark:bg-slate-800/80 space-y-3 border border-slate-200 dark:border-slate-700">
                            <div className="flex justify-between items-center">
                              <span className="font-bold text-xs text-google-blue">Certification #{cIdx + 1}</span>
                              <button type="button" onClick={() => handleDeleteCertification(cIdx)} className="text-google-red text-xs font-bold">Remove</button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                              <div>
                                <label className="block text-[10px] font-bold mb-1">Certification Title</label>

                                  type="text" 
                                  value={cert.title}
                                  onChange={(e) => {
                                    const updated = [...editData.certifications];
                                    updated[cIdx].title = e.target.value;
                                    setEditData({...editData, certifications: updated});
                                  }}
                                  placeholder="e.g. Communication & Soft Skills"
                                  className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-xs"
                                />
                              </div>
                              <div>
                                <label className="block text-[10px] font-bold mb-1">Issuing Organization</label>
                                <input 
                                  type="text" 
                                  value={cert.issuer}
                                  onChange={(e) => {
                                    const updated = [...editData.certifications];
                                    updated[cIdx].issuer = e.target.value;
                                    setEditData({...editData, certifications: updated});
                                  }}
                                  placeholder="e.g. Freedom Employability Academy"
                                  className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-xs"
                                />
                              </div>
                              <div>
                                <label className="block text-[10px] font-bold mb-1">Date / Period</label>
                                <input 
                                  type="text" 
                                  value={cert.period}
                                  onChange={(e) => {
                                    const updated = [...editData.certifications];
                                    updated[cIdx].period = e.target.value;
                                    setEditData({...editData, certifications: updated});
                                  }}
                                  placeholder="e.g. Dec 2023 – Dec 2024"
                                  className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-xs font-mono"
                                />
                              </div>
                            </div>
                            <div>
                              <label className="block text-[10px] font-bold mb-1">Verification / Credential Link (Optional)</label>
                              <input 
                                type="text" 
                                value={cert.credentialUrl || ''}
                                onChange={(e) => {
                                  const updated = [...editData.certifications];
                                  updated[cIdx].credentialUrl = e.target.value;
                                  setEditData({...editData, certifications: updated});
                                }}
                                placeholder="https://... verification link"
                                className="w-full px-3 py-2 rounded-xl bg-white dark:bg-slate-900 text-xs font-mono"
                              />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Actions */}
                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
                      <button type="button" onClick={() => setAdminPanelOpen(false)} className="px-5 py-2.5 rounded-full bg-slate-200 dark:bg-slate-800 text-xs font-bold">Cancel</button>
                      <button type="submit" className="px-6 py-2.5 rounded-full bg-google-blue text-white text-xs font-bold shadow-lg">Save Portfolio Changes</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Footer */}
            <footer className="py-8 text-center text-xs text-slate-500 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center max-w-7xl mx-auto px-6">
              <span>© {new Date().getFullYear()} {portfolioData.personal.name} | {portfolioData.personal.title}</span>
              <button onClick={() => setAdminAuthOpen(true)} className="text-slate-400 hover:text-google-blue text-xs font-semibold">
                🔒 Owner Edit Panel
              </button>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
